[package]
name = "datiolabs-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
arrow = "58.0.0"
arrow-cast = "58.0.0"
arrow-ipc = "58.0.0"
arrow-string = "58.0.0"
chrono = "0.4.44"
csv = "1.4.0"
rand = "0.10.0"
regex = "1.12.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rust_decimal = { version = "1.40.0", features = ["maths", "serde", "serde-with-str"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10.9"
siphasher = "1.0.2"
sled = "0.34.7"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
[dev-dependencies]
proptest = "1.4.0"
